openapi: 3.0.3
info:
  title: API Universitaria - Gestión de Cursos
  description: API REST para administrar los cursos de una universidad.
  version: 1.0.0
servers:
  - url: http://localhost:8082
    description: Servidor local
tags:
  - name: Cursos
    description: Operaciones sobre los cursos universitarios

paths:
  /api/v1/cursos:
    post:
      tags: [Cursos]
      summary: Crear un curso
      operationId: crearCurso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CursoRequest'
            example:
              nombre: Programación Orientada a Objetos
              codigo: POO-101
              creditos: 4
              estado: ACTIVO
      responses:
        '201':
          description: Curso creado correctamente
          headers:
            Location:
              description: URL del curso creado
              schema:
                type: string
                example: /api/v1/cursos/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursoResponse'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '409':
          $ref: '#/components/responses/Conflicto'
    get:
      tags: [Cursos]
      summary: Consultar todos los cursos
      operationId: consultarCursos
      responses:
        '200':
          description: Lista de cursos (vacía si no hay registros)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CursoResponse'

  /api/v1/cursos/codigo/{codigo}:
    get:
      tags: [Cursos]
      summary: Consultar un curso por código
      operationId: consultarCursoPorCodigo
      parameters:
        - name: codigo
          in: path
          required: true
          description: Código único del curso
          schema:
            type: string
            example: POO-101
      responses:
        '200':
          description: Curso encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursoResponse'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /api/v1/cursos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador del curso
        schema:
          type: integer
          format: int64
          example: 1
    put:
      tags: [Cursos]
      summary: Actualizar un curso
      operationId: actualizarCurso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CursoRequest'
      responses:
        '200':
          description: Curso actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursoResponse'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
    delete:
      tags: [Cursos]
      summary: Eliminar un curso
      operationId: eliminarCurso
      responses:
        '204':
          description: Curso eliminado correctamente (sin contenido)
        '404':
          $ref: '#/components/responses/NoEncontrado'

components:
  schemas:
    EstadoCurso:
      type: string
      enum: [ACTIVO, INACTIVO]
      example: ACTIVO

    CursoRequest:
      type: object
      required: [nombre, codigo, creditos, estado]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
          example: Programación Orientada a Objetos
        codigo:
          type: string
          description: Código único del curso (letras, números y guiones)
          example: POO-101
        creditos:
          type: integer
          minimum: 1
          maximum: 10
          example: 4
        estado:
          $ref: '#/components/schemas/EstadoCurso'

    CursoResponse:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
              example: 1
        - $ref: '#/components/schemas/CursoRequest'

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-09-18T10:15:30"
        status:
          type: integer
          example: 404
        error:
          type: string
          example: Not Found
        mensaje:
          type: string
          example: No existe un curso con código POO-999
        detalles:
          type: array
          items:
            type: string
            example: "creditos: debe ser mayor o igual a 1"

  responses:
    SolicitudInvalida:
      description: Datos de entrada inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NoEncontrado:
      description: El recurso solicitado no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflicto:
      description: Conflicto con el estado actual (por ejemplo, código duplicado)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
