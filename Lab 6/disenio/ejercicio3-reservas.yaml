openapi: 3.0.3
info:
  title: API de Hotel - Gestión de Reservas
  description: API REST para administrar las reservas de un hotel.
  version: 1.0.0
servers:
  - url: http://localhost:8083
    description: Servidor local
tags:
  - name: Reservas
    description: Operaciones sobre las reservas del hotel

paths:
  /api/v1/reservas:
    post:
      tags: [Reservas]
      summary: Crear una reserva
      description: La reserva se crea con estado CONFIRMADA. La habitación no puede estar reservada en el rango de fechas indicado.
      operationId: crearReserva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaRequest'
            example:
              nombreCliente: María López
              habitacion: "204"
              fechaEntrada: "2026-10-01"
              fechaSalida: "2026-10-05"
      responses:
        '201':
          description: Reserva creada correctamente
          headers:
            Location:
              description: URL de la reserva creada
              schema:
                type: string
                example: /api/v1/reservas/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '409':
          $ref: '#/components/responses/Conflicto'
    get:
      tags: [Reservas]
      summary: Consultar todas las reservas
      operationId: consultarReservas
      responses:
        '200':
          description: Lista de reservas (vacía si no hay registros)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservaResponse'

  /api/v1/reservas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador de la reserva
        schema:
          type: integer
          format: int64
          example: 1
    get:
      tags: [Reservas]
      summary: Consultar una reserva por id
      operationId: consultarReservaPorId
      responses:
        '200':
          description: Reserva encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    put:
      tags: [Reservas]
      summary: Actualizar una reserva
      description: No se puede actualizar una reserva cancelada.
      operationId: actualizarReserva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaRequest'
      responses:
        '200':
          description: Reserva actualizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'

  /api/v1/reservas/{id}/cancelar:
    patch:
      tags: [Reservas]
      summary: Cancelar una reserva
      description: Cambia el estado de la reserva a CANCELADA (no se borra el registro).
      operationId: cancelarReserva
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador de la reserva
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Reserva cancelada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'

components:
  schemas:
    EstadoReserva:
      type: string
      enum: [CONFIRMADA, CANCELADA]
      example: CONFIRMADA

    ReservaRequest:
      type: object
      required: [nombreCliente, habitacion, fechaEntrada, fechaSalida]
      properties:
        nombreCliente:
          type: string
          minLength: 1
          maxLength: 100
          example: María López
        habitacion:
          type: string
          description: Número o identificador de la habitación
          example: "204"
        fechaEntrada:
          type: string
          format: date
          example: "2026-10-01"
        fechaSalida:
          type: string
          format: date
          description: Debe ser posterior a la fecha de entrada
          example: "2026-10-05"

    ReservaResponse:
      type: object
      required: [id, nombreCliente, habitacion, fechaEntrada, fechaSalida, estado]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nombreCliente:
          type: string
          example: María López
        habitacion:
          type: string
          example: "204"
        fechaEntrada:
          type: string
          format: date
          example: "2026-10-01"
        fechaSalida:
          type: string
          format: date
          example: "2026-10-05"
        estado:
          $ref: '#/components/schemas/EstadoReserva'

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-09-18T10:15:30"
        status:
          type: integer
          example: 409
        error:
          type: string
          example: Conflict
        mensaje:
          type: string
          example: La habitación 204 ya está reservada en esas fechas
        detalles:
          type: array
          items:
            type: string
            example: "nombreCliente: no debe estar vacío"

  responses:
    SolicitudInvalida:
      description: Datos de entrada inválidos (campos faltantes, fechas incoherentes, formato incorrecto)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NoEncontrado:
      description: El recurso solicitado no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflicto:
      description: Conflicto con el estado actual (habitación ocupada o reserva ya cancelada)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
