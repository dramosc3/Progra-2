openapi: 3.0.3
info:
  title: API de Biblioteca - Gestión de Libros
  description: API REST para administrar los libros de una biblioteca.
  version: 1.0.0
servers:
  - url: http://localhost:8081
    description: Servidor local
tags:
  - name: Libros
    description: Operaciones sobre los libros de la biblioteca

paths:
  /api/v1/libros:
    post:
      tags: [Libros]
      summary: Registrar un libro
      operationId: registrarLibro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibroRequest'
            example:
              titulo: Cien años de soledad
              autor: Gabriel García Márquez
              isbn: "9780307474728"
              anioPublicacion: 1967
              estado: DISPONIBLE
      responses:
        '201':
          description: Libro registrado correctamente
          headers:
            Location:
              description: URL del libro creado
              schema:
                type: string
                example: /api/v1/libros/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibroResponse'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '409':
          $ref: '#/components/responses/Conflicto'
    get:
      tags: [Libros]
      summary: Consultar todos los libros
      operationId: consultarLibros
      responses:
        '200':
          description: Lista de libros (vacía si no hay registros)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LibroResponse'

  /api/v1/libros/titulo/{titulo}:
    get:
      tags: [Libros]
      summary: Consultar un libro por título
      description: Busca el libro cuyo título coincide exactamente (sin distinguir mayúsculas de minúsculas).
      operationId: consultarLibroPorTitulo
      parameters:
        - name: titulo
          in: path
          required: true
          description: Título del libro
          schema:
            type: string
            example: Cien años de soledad
      responses:
        '200':
          description: Libro encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibroResponse'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /api/v1/libros/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador del libro
        schema:
          type: integer
          format: int64
          example: 1
    put:
      tags: [Libros]
      summary: Actualizar un libro
      operationId: actualizarLibro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibroRequest'
      responses:
        '200':
          description: Libro actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibroResponse'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
    delete:
      tags: [Libros]
      summary: Eliminar un libro
      operationId: eliminarLibro
      responses:
        '204':
          description: Libro eliminado correctamente (sin contenido)
        '404':
          $ref: '#/components/responses/NoEncontrado'

components:
  schemas:
    EstadoLibro:
      type: string
      description: Estado del libro dentro de la biblioteca
      enum: [DISPONIBLE, PRESTADO, EN_REPARACION]
      example: DISPONIBLE

    LibroRequest:
      type: object
      required: [titulo, autor, isbn, anioPublicacion, estado]
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 150
          example: Cien años de soledad
        autor:
          type: string
          minLength: 1
          maxLength: 100
          example: Gabriel García Márquez
        isbn:
          type: string
          description: ISBN de 10 o 13 dígitos (se permiten guiones). Debe ser único.
          example: "9780307474728"
        anioPublicacion:
          type: integer
          minimum: 1000
          maximum: 2100
          example: 1967
        estado:
          $ref: '#/components/schemas/EstadoLibro'

    LibroResponse:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
              example: 1
        - $ref: '#/components/schemas/LibroRequest'

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-09-18T10:15:30"
        status:
          type: integer
          example: 404
        error:
          type: string
          example: Not Found
        mensaje:
          type: string
          example: No existe un libro con id 99
        detalles:
          type: array
          description: Errores de validación por campo (si aplica)
          items:
            type: string
            example: "titulo: no debe estar vacío"

  responses:
    SolicitudInvalida:
      description: Datos de entrada inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NoEncontrado:
      description: El recurso solicitado no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflicto:
      description: Conflicto con el estado actual (por ejemplo, ISBN duplicado)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
